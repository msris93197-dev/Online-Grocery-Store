#Spring configuration for jsp
spring.mvc.view.prefix = /WEB-INF/views/
spring.mvc.view.suffix = .jsp
server.port = ${PORT:8888}
# Keep the session id in a cookie only, never in URLs (;jsessionid=...)
server.servlet.session.tracking-modes=cookie
pdf_image=jio.png
count=1000
product_size=8
# Store details printed on PDF invoices
store_name=${STORE_NAME:Pantrix}
store_address=${STORE_ADDRESS:Online grocery store}
store_pin=${STORE_PIN:}
# Set here configurations for the database connection
# For LocalHost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/general_stores?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}


# Specify the DBMS
spring.jpa.database = MYSQL
# Show or not log for each sql query
spring.jpa.show-sql = false
#create-drop| update | validate | none
spring.jpa.hibernate.ddl-auto = update

# SQL dialect for generating optimized queries
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect

#Email Properties
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:email}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
# Optional address that gets a copy of every order email (leave empty to disable)
mailToCc=${MAIL_CC:}
email.call.back.url = ${APP_URL:http://localhost:8888}/customer/change-password/
email-call-back-url = /customer/change-password/
email.expire.time = 24
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

#uploadFolder=/usr/local/cpanel/base/uploads
upoadDir=/resources

 
 
